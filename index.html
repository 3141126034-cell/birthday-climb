<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1230">
<title>生日快乐 · 财源滚滚</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1230;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #cv { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<audio id="bgmTrack" src="bgm.mp3" loop preload="metadata"></audio>
<script>
"use strict";

/* ══════════════════════════════  基础  ══════════════════════════════ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 390, H = 760, S = 1, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W / 390, H / 760);
  if (!started) reset();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

/* ══════════════════════════════  音效  ══════════════════════════════ */
const AU = (() => {
  let actx = null, master = null, muted = false;
  function init() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.34;
    master.connect(actx.destination);
  }
  function resume() { if (actx && actx.state === "suspended") actx.resume(); }
  function tone(freq, t0, dur, type, gain, glide) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    const t = actx.currentTime + t0;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(30, glide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  const MELODY = [0, 2, 4, 5, 4, 2, 0, 2, 3, 2, 0, -1, 1, 2, 3, 4];
  const bg = { on: false, next: 0, step: 0, beat: 0.44 };
  function bgmNote(freq, when, dur, g, type) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(freq, when);
    gn.gain.setValueAtTime(0, when);
    gn.gain.linearRampToValueAtTime(g, when + 0.03);
    gn.gain.exponentialRampToValueAtTime(0.0008, when + dur);
    o.connect(gn); gn.connect(master);
    o.start(when); o.stop(when + dur + 0.03);
  }
  function bgmStart() {
    if (!actx || bg.on) return;
    bg.on = true; bg.step = 0;
    bg.next = actx.currentTime + 0.25;
  }
  function bgmStop() { bg.on = false; }
  function bgmTick() {
    if (!actx || !bg.on || muted) return;
    while (bg.next < actx.currentTime + 0.8) {
      const i = bg.step % MELODY.length;
      const n = MELODY[i];
      const t = bg.next;
      if (n >= 0) {
        bgmNote(SCALE[n], t, 0.96, 0.055);
        bgmNote(SCALE[n] * 2, t, 0.55, 0.018);
      }
      if (i % 4 === 0) {
        const root = [261.63, 196.00, 220.00, 174.61][Math.floor(bg.step / 4) % 4];
        bgmNote(root, t, 1.7, 0.05, "sine");
      }
      bg.step++;
      bg.next += bg.beat;
    }
  }
  return {
    init, resume, bgmStart, bgmStop, bgmTick,
    jump()   { tone(520, 0, 0.16, "triangle", 0.20, 880); },
    jump2()  { tone(720, 0, 0.14, "triangle", 0.17, 1180); tone(1180, 0.05, 0.10, "triangle", 0.10, 1520); },
    land()   { tone(180, 0, 0.10, "sine", 0.14, 120); },
    coin()   { tone(1180, 0, 0.09, "triangle", 0.16); tone(1580, 0.06, 0.11, "triangle", 0.13); },
    fall()   { tone(420, 0, 0.42, "sine", 0.16, 70); },
    hit() {
      tone(220, 0, 0.16, "square", 0.16, 90);
      tone(120, 0.03, 0.24, "sawtooth", 0.12, 55);
    },
    over() {
      [392, 330, 262, 196].forEach((f, i) => tone(f, i * 0.16, 0.45, "triangle", 0.15));
      tone(98, 0.64, 1.2, "sine", 0.14, 70);
    },
    shortfall() {
      tone(520, 0, 0.18, "triangle", 0.14, 392);
      tone(392, 0.20, 0.30, "triangle", 0.12, 262);
    },
    win() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.10, 0.55, "triangle", 0.16));
      tone(523, 0.52, 1.5, "sine", 0.13);
      tone(784, 0.52, 1.5, "sine", 0.10);
      tone(1047, 0.52, 1.5, "sine", 0.09);
    },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.34; return muted; },
    get muted() { return muted; },
  };
})();

/* ══════════════════════════════  关卡  ══════════════════════════════ */
const CFG = {
  runSpeed: 215,
  gravity: 1850,
  jumpV: -720,
  coinTotal: 100,
  winAt: 47,
  coyote: 0.10,
  lives: 3,
};

let plats = [];
let coins = [];
let levelEndX = 0;

function addPlatform() {
  const last = plats[plats.length - 1];
  const gap = rand(78, 112);
  let dy = rand(-88, 88);
  if (last.y > 78) dy = -Math.abs(dy) * 0.85;
  if (last.y < -78) dy = Math.abs(dy) * 0.85;
  const y = clamp(last.y + dy, -122, 122);
  const w = rand(230, 345);
  const p = { x: levelEndX + gap, y, w };
  plats.push(p);
  levelEndX = p.x + p.w;
}

function buildLevel() {
  plats = [];
  coins = [];
  plats.push({ x: 0, y: 0, w: 330 });
  levelEndX = 330;
  for (let i = 0; i < 30; i++) addPlatform();

  const spots = [];
  for (const p of plats) {
    const n = Math.max(3, Math.round(p.w / 88));
    for (let k = 0; k < n; k++) {
      spots.push({
        x: p.x + (p.w * (k + 0.5)) / n,
        y: p.y - (k % 2 === 0 ? 98 : 126),
      });
    }
    if (Math.random() < 0.45) {
      spots.push({ x: p.x + p.w + 24, y: p.y - 140 });
    }
  }
  const step = spots.length / CFG.coinTotal;
  for (let i = 0; i < CFG.coinTotal; i++) {
    const c = spots[Math.min(spots.length - 1, Math.floor(i * step))];
    coins.push({ x: c.x, y: c.y, taken: false, ph: Math.random() * 6.28 });
  }
}

function extendWorld() {
  while (levelEndX < player.x + W * 1.7) addPlatform();
  const cut = player.x - W * 1.2;
  while (plats.length > 3 && plats[0].x + plats[0].w < cut) plats.shift();
  for (let i = coins.length - 1; i >= 0; i--) {
    if (coins[i].taken || coins[i].x < cut) coins.splice(i, 1);
  }
}

/* ══════════════════════════════  状态  ══════════════════════════════ */
let started = false;
let mode = "intro";
let time = 0, introT = 0, winT = 0;

const player = {
  x: 0, y: 0, vy: 0, onGround: true, coyoteT: 0, jumps: 2,
  runPhase: 0, hurtT: 0, squash: 0,
};
let camX = 0, camShake = 0;
const BASEY = () => H * 0.66;
let got = 0;
let best = 0;
let lives = 3;
let milestone = { text: "", t: 0 };
const MILESTONES = {
  8: "爸",
  14: "生日快乐",
  22: "你辛苦了",
  31: "祝你天天开心",
  40: "永远不死",
};
let overT = 0;
let missiles = [];
let missileTimer = 1.4;
let particles = [];
let fireworks = [];

function reset() {
  buildLevel();
  player.x = 60; player.y = 0; player.vy = 0;
  player.onGround = true; player.hurtT = 0; player.squash = 0;
  player.jumps = 2;
  camX = 0; camShake = 0; got = 0; best = 0;
  lives = CFG.lives; overT = 0; missiles = []; missileTimer = 1.4;
  particles = []; fireworks = [];
  milestone = { text: "", t: 0 };
  coins.forEach(c => c.taken = false);
  mode = "intro"; introT = 0; winT = 0; started = true;
}

/* ══════════════════════════════  物理  ══════════════════════════════ */
function groundAt(x, y) {
  let bestY = null;
  for (const p of plats) {
    if (x >= p.x - 12 && x <= p.x + p.w + 12) {
      if (p.y >= y - 8 && (bestY === null || p.y < bestY)) bestY = p.y;
    }
  }
  return bestY;
}

function updatePlay(dt) {
  const p = player;
  p.hurtT = Math.max(0, p.hurtT - dt);
  p.squash = Math.max(0, p.squash - dt * 5);

  if (p.hurtT <= 0) p.x += CFG.runSpeed * dt;

  p.vy += CFG.gravity * dt;
  p.y += p.vy * dt;

  if (p.vy >= 0) {
    for (const pl of plats) {
      if (p.x < pl.x - 10 || p.x > pl.x + pl.w + 10) continue;
      const prev = p.y - p.vy * dt;
      if (prev <= pl.y + 2 && p.y >= pl.y) {
        if (!p.onGround) { AU.land(); p.squash = 1; }
        p.y = pl.y; p.vy = 0; p.onGround = true;
        p.jumps = 2;
        break;
      }
    }
  }

  if (p.onGround) {
    const g = groundAt(p.x, p.y);
    if (g === null || Math.abs(g - p.y) > 2) p.onGround = false;
  }

  if (p.onGround) p.coyoteT = CFG.coyote;
  else p.coyoteT = Math.max(0, p.coyoteT - dt);

  p.runPhase += dt * (p.onGround ? 12 : 4);

  if (p.y > 240) die();

  for (const c of coins) {
    if (c.taken) continue;
    const dx = c.x - p.x, dy = c.y - (p.y - 46);
    if (dx * dx + dy * dy < 36 * 36) {
      c.taken = true; got++;
      AU.coin();
      burst(c.x, c.y, 10, "#ffd97a");
      const ms = MILESTONES[got];
      if (ms) milestone = { text: ms, t: 1.8 };
      if (got >= CFG.winAt) { win(); return; }
    }
  }

  updateMissiles(dt);

  best = Math.max(best, p.x);
}

/* ── 导弹 ── */
function spawnMissile() {
  const p = player;
  let gy = p.y;
  const g = groundAt(p.x, -9999);
  if (g !== null) gy = g;
  const high = Math.random() < 0.42;
  const y = gy - (high ? rand(118, 152) : rand(30, 58));
  missiles.push({
    x: p.x + W + 70,
    y,
    vx: -(238 + Math.random() * 70),
    t: 0,
    ph: Math.random() * 6.28,
  });
}

function updateMissiles(dt) {
  const p = player;
  missileTimer -= dt;
  if (missileTimer <= 0) {
    spawnMissile();
    missileTimer = rand(1.5, 2.4);
  }
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    m.x += m.vx * dt;
    m.t += dt;
    if (m.x < p.x - W * 1.1) { missiles.splice(i, 1); continue; }
    if (p.hurtT <= 0) {
      const dx = m.x - p.x;
      const dy = m.y - (p.y - 50);
      if (dx * dx + dy * dy < 34 * 34) {
        missiles.splice(i, 1);
        hitByMissile();
      }
    }
  }
}

function hitByMissile() {
  lives--;
  player.hurtT = 1.15;
  camShake = 0.5;
  AU.hit();
  burst(player.x, player.y - 50, 22, "#ff7a5c");
  if (lives <= 0) gameOver();
}

function die() {
  lives--;
  AU.fall();
  camShake = 0.45;
  burst(player.x, player.y - 40, 18, "#ff9c7a");
  if (lives <= 0) { gameOver(); return; }
  let back = plats[0];
  for (const pl of plats) {
    if (pl.x + pl.w * 0.5 < player.x) back = pl;
  }
  player.x = back.x + back.w * 0.5;
  player.y = back.y - 220;
  player.vy = 0;
  player.onGround = false;
  player.hurtT = 0.95;
  missiles = [];
  missileTimer = 1.9;
}

function doJump() {
  const p = player;
  if (mode !== "play") return;
  const grounded = p.onGround || p.coyoteT > 0;
  if (grounded) p.jumps = 2;
  if (p.jumps <= 0) return;
  p.vy = CFG.jumpV;
  p.onGround = false;
  p.coyoteT = 0;
  p.jumps--;
  p.squash = 1;
  if (grounded) {
    AU.jump();
    burst(p.x, p.y, 6, "rgba(255,235,200,0.9)");
  } else {
    AU.jump2();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 6.2832;
      particles.push({
        x: p.x, y: p.y - 14,
        vx: Math.cos(a) * 105, vy: Math.sin(a) * 34 + 26,
        life: 0.34, max: 0.34, color: "rgba(255,214,160,0.92)", r: 2.3,
      });
    }
  }
}

function win() {
  if (mode === "win") return;
  mode = "win";
  winT = 0;
  AU.win();
  for (let i = 0; i < 6; i++) {
    fireworks.push({
      x: W * rand(0.15, 0.85),
      y: H * rand(0.06, 0.24),
      t: -i * 0.30,
      hue: [42, 30, 16, 350, 45, 25][i],
    });
  }
}

function gameOver() {
  if (mode === "over") return;
  mode = "over";
  overT = 0;
  player.hurtT = 0;
  AU.over();
}

function reachGoalShort() {
  if (mode === "short") return;
  mode = "short";
  overT = 0;
  AU.shortfall();
}

/* ══════════════════════════════  粒子  ══════════════════════════════ */
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(30, 170);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: rand(0.3, 0.75), max: 0.75, color, r: rand(1.2, 3.2),
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += 520 * dt; q.vx *= 0.96;
  }
  for (const f of fireworks) f.t += dt;
  for (let i = fireworks.length - 1; i >= 0; i--) {
    if (fireworks[i].t > 2.2) fireworks.splice(i, 1);
  }
}

/* ══════════════════════════════  绘制  ══════════════════════════════ */
const SKY = ["#241a3c", "#3a2350", "#5d2f63", "#8e3f6b", "#bf5a6e", "#e8855a", "#f6a95e"];
let skyGrad = null;

function makeSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  SKY.forEach((c, i) => g.addColorStop(i / (SKY.length - 1), c));
  skyGrad = g;
}

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  const sx = W * 0.78 - camX * 0.04, sy = H * 0.34;
  const sg = ctx.createRadialGradient(sx, sy, 6, sx, sy, 190 * S);
  sg.addColorStop(0, "rgba(255,240,200,0.95)");
  sg.addColorStop(0.28, "rgba(255,205,130,0.55)");
  sg.addColorStop(1, "rgba(255,170,90,0)");
  ctx.fillStyle = sg;
  ctx.fillRect(sx - 200 * S, sy - 200 * S, 400 * S, 400 * S);
  ctx.fillStyle = "#ffeec2";
  ctx.beginPath();
  ctx.arc(sx, sy, 40 * S, 0, 6.2832);
  ctx.fill();
}

function drawClouds() {
  const clouds = [
    { x: 160, y: 0.15, s: 1.15, k: 0.05 },
    { x: 620, y: 0.10, s: 0.85, k: 0.05 },
    { x: 1180, y: 0.19, s: 1.35, k: 0.05 },
    { x: 1720, y: 0.08, s: 0.95, k: 0.05 },
    { x: 2340, y: 0.16, s: 1.05, k: 0.05 },
  ];
  const span = 2900;
  for (const c of clouds) {
    let cx = ((c.x - camX * c.k) % span + span) % span - 260;
    cx += Math.sin(time * 0.12 + c.x) * 8;
    if (cx < -260 || cx > W + 260) continue;
    const cy = H * c.y + Math.sin(time * 0.16 + c.x * 0.01) * 5;
    const r = 44 * S * c.s;
    ctx.shadowColor = "rgba(255,232,214,0.55)";
    ctx.shadowBlur = 36 * S;
    ctx.fillStyle = "rgba(255,244,236,0.40)";
    for (const d of [[-1.5, 0.15, 0.78], [-0.55, -0.32, 1.0], [0.5, -0.18, 0.88], [1.45, 0.18, 0.7]]) {
      ctx.beginPath();
      ctx.ellipse(cx + d[0] * r, cy + d[1] * r, r * d[2], r * d[2] * 0.62, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

function drawBalloons() {
  const items = [
    { x: 340, sp: 26, off: 700, col: "#ff8fa3", col2: "#ff6b8a" },
    { x: 980, sp: 19, off: 980, col: "#ffcf7a", col2: "#f5a94c" },
    { x: 1610, sp: 23, off: 400, col: "#a8d8ff", col2: "#7fbdf0" },
    { x: 2180, sp: 21, off: 1150, col: "#c9b6ff", col2: "#a894f0" },
  ];
  const span = 2700;
  const rise = H * 1.15;
  for (const b of items) {
    let bx = b.x - camX * 0.18;
    bx = ((bx % span) + span) % span - 200;
    if (bx < -160 || bx > W + 160) continue;
    const by = H * 1.02 - ((time * b.sp + b.off) % rise);
    const fade = clamp((H * 0.60 - by) / (H * 0.14), 0, 1);
    if (fade <= 0.02) continue;
    const squash = 1 + Math.sin(time * 1.6 + b.off) * 0.04;
    const r = 17 * S;
    ctx.globalAlpha = fade;
    ctx.strokeStyle = "rgba(255,228,200,0.22)";
    ctx.lineWidth = 1.2 * S;
    ctx.beginPath();
    ctx.moveTo(bx, by + r * 1.3);
    ctx.quadraticCurveTo(bx + 7 * S, by + r * 2.4, bx + 2 * S, by + r * 3.6);
    ctx.stroke();
    const bg = ctx.createRadialGradient(bx - r * 0.35, by - r * 0.45, r * 0.2, bx, by, r * 1.35);
    bg.addColorStop(0, b.col);
    bg.addColorStop(1, b.col2);
    ctx.fillStyle = bg;
    ctx.globalAlpha = 0.80 * fade;
    ctx.beginPath();
    ctx.ellipse(bx, by, r, r * 1.22 * squash, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHills() {
  const layers = [
    { k: 0.05, base: H * 0.50, amp: 52, col: "rgba(88,54,102,0.55)" },
    { k: 0.10, base: H * 0.57, amp: 46, col: "rgba(70,42,86,0.70)" },
    { k: 0.20, base: H * 0.64, amp: 38, col: "rgba(50,30,64,0.86)" },
    { k: 0.32, base: H * 0.70, amp: 30, col: "rgba(34,20,46,0.95)" },
  ];
  let li = 0;
  for (const L of layers) {
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-40, H);
    const off = -camX * L.k;
    const seed = li * 1.7;
    for (let x = -40; x <= W + 40; x += 12) {
      const wx = (x - off) * 0.006;
      const h = Math.sin(wx * 1.7 + seed) * 0.5 + Math.sin(wx * 3.9 + 1.2 + seed) * 0.3 + Math.sin(wx * 7.3 + 2.4 + seed) * 0.2;
      ctx.lineTo(x, L.base - h * L.amp);
    }
    ctx.lineTo(W + 40, H);
    ctx.closePath();
    ctx.fill();
    li++;
  }
}

function drawGoal() {
  if (got < CFG.winAt) return;
  const gx = player.x + 30 * S - camX;
  if (gx < -120 || gx > W + 200) return;
  const gy = player.y + BASEY();

  ctx.strokeStyle = "#ffe1a8";
  ctx.lineWidth = 3 * S;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy - 118 * S);
  ctx.stroke();

  const wav = Math.sin(time * 3) * 3.5 * S;
  ctx.fillStyle = "#ff5f6d";
  ctx.beginPath();
  ctx.moveTo(gx, gy - 118 * S);
  ctx.quadraticCurveTo(gx + 28 * S, gy - 108 * S + wav, gx + 50 * S, gy - 96 * S);
  ctx.quadraticCurveTo(gx + 28 * S, gy - 84 * S - wav, gx, gy - 74 * S);
  ctx.closePath();
  ctx.fill();
}

function drawMilestone() {
  if (!milestone.text || milestone.t <= 0) return;
  const a = Math.min(1, (1.8 - milestone.t) / 0.30, milestone.t / 0.55);
  if (a <= 0) return;
  const n = [...milestone.text].length;
  const sz = n <= 1 ? 48 : n <= 3 ? 40 : 32;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(255,190,110,0.9)";
  ctx.shadowBlur = 24 * S;
  ctx.fillStyle = "#fff2d4";
  ctx.font = `600 ${sz * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText(milestone.text, W / 2, H * 0.40 - (1 - a) * 10 * S);
  ctx.restore();
}

function drawPlats() {
  for (const p of plats) {
    const sx = p.x - camX;
    if (sx > W + 80 || sx + p.w < -80) continue;
    const y = p.y + BASEY();

    const g = ctx.createLinearGradient(0, y, 0, y + 260 * S);
    g.addColorStop(0, "#4a3358");
    g.addColorStop(0.18, "#3b2848");
    g.addColorStop(1, "#241830");
    ctx.fillStyle = g;
    roundRect(sx, y, p.w, 210 * S, 6 * S);
    ctx.fill();

    ctx.fillStyle = "rgba(255,196,148,0.72)";
    ctx.fillRect(sx, y - 3 * S, p.w, 3.4 * S);

    ctx.fillStyle = "rgba(12,6,18,0.35)";
    ctx.fillRect(sx, y + 3 * S, p.w, 5 * S);

    const seed = Math.round(p.x * 0.13);
    ctx.lineWidth = 1.5 * S;
    for (let i = 0; i < 8; i++) {
      const t1 = ((seed * 7 + i * 37) % 100) / 100;
      const gx2 = sx + t1 * p.w;
      if (gx2 < -12 || gx2 > W + 12) continue;
      const hgt = (5 + ((seed + i * 17) % 10)) * S;
      ctx.strokeStyle = "rgba(214,190,132,0.42)";
      ctx.beginPath();
      ctx.moveTo(gx2, y);
      ctx.quadraticCurveTo(gx2 + 3.5 * S, y - hgt * 0.7, gx2 + 6 * S, y - hgt);
      ctx.stroke();
    }
    for (let i = 0; i < 6; i++) {
      const t2 = ((seed * 3 + i * 53) % 100) / 100;
      const rx = sx + t2 * p.w;
      if (rx < -12 || rx > W + 12) continue;
      ctx.fillStyle = "rgba(255,196,156,0.15)";
      ctx.beginPath();
      ctx.arc(rx, y + (7 + ((seed + i * 11) % 16)) * S, (1.3 + (i % 3) * 0.7) * S, 0, 6.2832);
      ctx.fill();
    }
  }
}

function drawCoins() {
  for (const c of coins) {
    if (c.taken) continue;
    const sx = c.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    const y = c.y + BASEY() + Math.sin(time * 2.6 + c.ph) * 4 * S;

    const g = ctx.createRadialGradient(sx, y, 2, sx, y, 34 * S);
    g.addColorStop(0, "rgba(255,240,170,0.55)");
    g.addColorStop(1, "rgba(255,200,90,0)");
    ctx.fillStyle = g;
    ctx.fillRect(sx - 36 * S, y - 36 * S, 72 * S, 72 * S);

    const r = 13 * S;
    const cg = ctx.createLinearGradient(sx - r, y - r, sx + r, y + r);
    cg.addColorStop(0, "#ffe9a8");
    cg.addColorStop(0.5, "#ffc95e");
    cg.addColorStop(1, "#e39b2e");
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(sx, y, r, 0, 6.2832);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,235,0.85)";
    ctx.lineWidth = 1.6 * S;
    ctx.beginPath();
    ctx.arc(sx, y, r * 0.66, 0, 6.2832);
    ctx.stroke();
  }
}

function drawMissiles() {
  for (const m of missiles) {
    const sx = m.x - camX;
    if (sx < -100 || sx > W + 100) continue;
    const y = m.y + BASEY();

    const fl = 0.72 + 0.28 * Math.sin(time * 24 + m.ph);
    const fg = ctx.createLinearGradient(sx + 4 * S, y, sx + 52 * S * fl, y);
    fg.addColorStop(0, "rgba(255,196,96,0.9)");
    fg.addColorStop(0.45, "rgba(255,116,62,0.5)");
    fg.addColorStop(1, "rgba(255,80,40,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(sx + 4 * S, y - 6.5 * S);
    ctx.lineTo(sx + 4 * S, y + 6.5 * S);
    ctx.lineTo(sx + 54 * S * fl, y);
    ctx.closePath();
    ctx.fill();

    const rg = ctx.createRadialGradient(sx, y, 4, sx, y, 62 * S);
    rg.addColorStop(0, "rgba(255,96,72,0.45)");
    rg.addColorStop(1, "rgba(255,60,40,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(sx - 62 * S, y - 62 * S, 124 * S, 124 * S);

    const bg2 = ctx.createLinearGradient(sx - 26 * S, y - 11 * S, sx + 26 * S, y + 11 * S);
    bg2.addColorStop(0, "#455060");
    bg2.addColorStop(0.42, "#e2e9f2");
    bg2.addColorStop(1, "#8792a1");
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.ellipse(sx, y, 27 * S, 10.5 * S, 0, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,90,70,0.75)";
    ctx.lineWidth = 1.6 * S;
    ctx.stroke();

    ctx.fillStyle = "#ff4a38";
    ctx.beginPath();
    ctx.moveTo(sx - 26 * S, y - 9.5 * S);
    ctx.lineTo(sx - 41 * S, y);
    ctx.lineTo(sx - 26 * S, y + 9.5 * S);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffd9a0";
    ctx.beginPath();
    ctx.moveTo(sx + 18 * S, y - 6 * S);
    ctx.lineTo(sx + 31 * S, y - 12 * S);
    ctx.lineTo(sx + 31 * S, y + 12 * S);
    ctx.lineTo(sx + 18 * S, y + 6 * S);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPlayer() {
  const p = player;
  const px = p.x - camX;
  const py = p.y + BASEY();
  const s = S * 1.04;
  const air = !p.onGround;
  const sq = p.squash;
  const sqx = 1 + 0.12 * sq, sqy = 1 - 0.14 * sq;

  ctx.save();
  ctx.translate(px, py);

  if (!air) {
    ctx.fillStyle = "rgba(10,5,16,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, 2 * s, 22 * s, 5 * s, 0, 0, 6.2832);
    ctx.fill();
  }

  ctx.scale(sqx, sqy);

  const legH = 26 * s, bodyH = 34 * s, headR = 20 * s;
  const hipY = -legH - 1 * s;
  const bodyBot = hipY + 1 * s;
  const bodyTop = bodyBot - bodyH;
  const headCy = bodyTop - headR * 0.92;

  const swing = air ? 0.55 : Math.sin(p.runPhase) * 0.44;
  const hurt = p.hurtT > 0;

  ctx.lineCap = "round";
  ctx.strokeStyle = "#3f5a92";
  ctx.lineWidth = 9 * s;
  [[-1, swing], [1, -swing]].forEach(([side, sw]) => {
    ctx.beginPath();
    ctx.moveTo(side * 5 * s, hipY);
    ctx.lineTo(side * 7 * s + Math.sin(sw) * 13 * s, -2 * s);
    ctx.stroke();
  });

  ctx.strokeStyle = "#f3c79a";
  ctx.lineWidth = 6.4 * s;
  const armY = air ? -0.9 : Math.sin(p.runPhase + Math.PI) * 0.7;
  [[-1, armY], [1, -armY]].forEach(([side, sw]) => {
    ctx.beginPath();
    ctx.moveTo(side * 12 * s, bodyTop + 8 * s);
    ctx.lineTo(side * 12 * s + Math.sin(sw) * 10 * s, bodyTop + 22 * s + Math.cos(sw) * 6 * s);
    ctx.stroke();
  });

  const bg = ctx.createLinearGradient(0, bodyTop, 0, bodyBot);
  bg.addColorStop(0, "#1cb0ac");
  bg.addColorStop(1, "#0d7d7c");
  ctx.fillStyle = hurt ? "#e0574f" : bg;
  roundRect(-14 * s, bodyTop, 28 * s, bodyH, 9 * s);
  ctx.fill();

  ctx.fillStyle = "#e8b184";
  ctx.fillRect(-4 * s, bodyTop - 4 * s, 8 * s, 6 * s);

  ctx.fillStyle = "#f6cfa4";
  ctx.beginPath();
  ctx.arc(0, headCy, headR, 0, 6.2832);
  ctx.fill();

  ctx.fillStyle = "#241a24";
  ctx.beginPath();
  ctx.arc(0, headCy - 2 * s, headR * 1.005, Math.PI * 0.98, Math.PI * 2.02);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-headR * 0.86, headCy - 3 * s, headR * 0.30, headR * 0.52, -0.2, 0, 6.2832);
  ctx.fill();

  const er = headR * 0.30;
  const gap = headR * 0.32;
  [-1, 1].forEach(side => {
    ctx.strokeStyle = "#2a2130";
    ctx.lineWidth = 2.4 * s;
    ctx.beginPath();
    ctx.arc(side * gap, headCy + 1 * s, er, 0, 6.2832);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.beginPath();
    ctx.arc(side * gap, headCy + 1 * s, er, 0, 6.2832);
    ctx.fill();
  });
  ctx.strokeStyle = "#2a2130";
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.moveTo(-gap + er, headCy + 1 * s);
  ctx.lineTo(gap - er, headCy + 1 * s);
  ctx.stroke();

  ctx.strokeStyle = "#8a5b48";
  ctx.lineWidth = 1.8 * s;
  ctx.beginPath();
  ctx.arc(0, headCy + headR * 0.38, headR * 0.24, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x - camX, q.y, q.r * S, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function heartPath(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.88);
  ctx.bezierCurveTo(cx - r * 1.5, cy - r * 0.35, cx - r * 0.52, cy - r * 1.3, cx, cy - r * 0.32);
  ctx.bezierCurveTo(cx + r * 0.52, cy - r * 1.3, cx + r * 1.5, cy - r * 0.35, cx, cy + r * 0.88);
  ctx.closePath();
}

function drawHUD() {
  if (mode !== "play") return;
  const pad = 16 * S;

  const r = 9 * S;
  ctx.fillStyle = "#ffd97a";
  ctx.beginPath();
  ctx.arc(pad + r, pad + r, r, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = "#8a5a12";
  ctx.font = `700 ${11 * S}px "Noto Sans SC",sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("¥", pad + r, pad + r + 0.5 * S);

  ctx.textAlign = "left";
  ctx.fillStyle = "#fff3d6";
  ctx.font = `700 ${18 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText(String(got), pad + r * 2 + 8 * S, pad + r + 1 * S);
  ctx.fillStyle = "rgba(255,235,210,0.62)";
  ctx.font = `400 ${13 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText(`/ ${CFG.winAt}`, pad + r * 2 + 8 * S + 26 * S, pad + r + 2 * S);

  const bw = W - pad * 2, by = H - pad - 6 * S;
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  roundRect(pad, by, bw, 4 * S, 2 * S);
  ctx.fill();
  const pr = clamp(got / CFG.winAt, 0, 1);
  const pg = ctx.createLinearGradient(pad, 0, pad + bw, 0);
  pg.addColorStop(0, "#ffd97a");
  pg.addColorStop(1, "#ff9d5c");
  ctx.fillStyle = pg;
  roundRect(pad, by, Math.max(4 * S, bw * pr), 4 * S, 2 * S);
  ctx.fill();

  ctx.fillStyle = "#fff6e0";
  ctx.beginPath();
  ctx.arc(pad + bw * pr, by + 2 * S, 3.4 * S, 0, 6.2832);
  ctx.fill();

  const hr = 8 * S, hy = pad + r;
  for (let i = 0; i < CFG.lives; i++) {
    const hx = W - pad - hr * 1.05 - i * (hr * 2.35);
    heartPath(hx, hy, hr);
    ctx.fillStyle = i < lives ? "#ff6b6b" : "rgba(255,190,190,0.20)";
    ctx.fill();
    if (i < lives) {
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1.2 * S;
      ctx.stroke();
    }
  }
}

function drawIntro() {
  const a = clamp(introT * 2.4, 0, 1);
  ctx.fillStyle = `rgba(16,9,26,${0.42 * a})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.shadowColor = "rgba(255,200,120,0.75)";
  ctx.shadowBlur = 36 * S;
  ctx.fillStyle = "#fff4dc";
  ctx.font = `700 ${46 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("生日快乐", W / 2, H * 0.33);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,228,196,0.88)";
  ctx.font = `500 ${17 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText("47 岁 · 一路向前", W / 2, H * 0.33 + 44 * S);

  const pulse = 0.55 + 0.45 * Math.sin(introT * 2.8);
  ctx.globalAlpha = a * pulse;
  ctx.fillStyle = "#ffe9c4";
  ctx.font = `500 ${21 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText("点一下，开始跑", W / 2, H * 0.70);

  ctx.globalAlpha = a * 0.72;
  ctx.fillStyle = "rgba(255,220,180,0.85)";
  ctx.font = `400 ${14 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText("点一下跳 · 空中再点一次二段跳", W / 2, H * 0.70 + 34 * S);
  ctx.fillText("躲导弹 · 一直跑 · 收满 47 枚就通关", W / 2, H * 0.70 + 56 * S);

  ctx.globalAlpha = 1;
}

function drawWin() {
  const a = clamp((winT - 0.35) * 1.8, 0, 1);
  ctx.fillStyle = `rgba(14,7,22,${0.36 * a})`;
  ctx.fillRect(0, 0, W, H);

  for (const f of fireworks) {
    if (f.t < 0 || f.t > 1.6) continue;
    const k = f.t / 1.6;
    const rad = k * 175 * S;
    const alpha = (1 - k) * 0.9;
    for (let i = 0; i < 26; i++) {
      const ang = (i / 26) * 6.2832 + Math.sin(i * 7.13) * 0.26 + f.hue * 0.013;
      const jr = 0.38 + 0.62 * Math.abs(Math.sin(i * 12.9898 + f.hue * 0.37));
      const px = f.x + Math.cos(ang) * rad * jr;
      const py = f.y + Math.sin(ang) * rad * 0.9 * jr + k * k * 60 * S;
      ctx.fillStyle = `hsla(${f.hue + i * 2},100%,${72 - k * 20}%,${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, (3.2 - k * 2.2) * S, 0, 6.2832);
      ctx.fill();
    }
  }

  const px = player.x - camX;
  const py = player.y + BASEY();
  if (px > -60 && px < W + 60) {
    ctx.strokeStyle = "#ffe1a8";
    ctx.lineWidth = 2.6 * S;
    ctx.beginPath();
    ctx.moveTo(px + 30 * S, py);
    ctx.lineTo(px + 30 * S, py - 118 * S);
    ctx.stroke();
    const wav = Math.sin(time * 3) * 3.5 * S;
    ctx.fillStyle = "#ff5f6d";
    ctx.beginPath();
    ctx.moveTo(px + 30 * S, py - 118 * S);
    ctx.quadraticCurveTo(px + 58 * S, py - 108 * S + wav, px + 80 * S, py - 96 * S);
    ctx.quadraticCurveTo(px + 58 * S, py - 84 * S - wav, px + 30 * S, py - 74 * S);
    ctx.closePath();
    ctx.fill();
  }

  const cy = H * 0.40;

  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.shadowColor = "rgba(255,205,120,0.85)";
  ctx.shadowBlur = 30 * S;

  ctx.fillStyle = "rgba(255,226,186,0.92)";
  ctx.font = `500 ${26 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("爸，", W / 2, cy - 72 * S);

  ctx.fillStyle = "#fff6e0";
  ctx.font = `700 ${50 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("生日快乐", W / 2, cy - 18 * S);

  ctx.fillStyle = "rgba(255,232,200,0.92)";
  ctx.font = `500 ${19 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText("祝 47 岁", W / 2, cy + 40 * S);

  ctx.shadowBlur = 16 * S;
  ctx.shadowColor = "rgba(255,180,90,0.8)";
  ctx.fillStyle = "#ffd97a";
  ctx.font = `700 ${25 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("新的一年", W / 2, cy + 88 * S);
  ctx.font = `700 ${31 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("财源滚滚", W / 2, cy + 130 * S);

  ctx.shadowBlur = 0;
  ctx.globalAlpha = a * 0.9;
  ctx.fillStyle = "rgba(255,235,205,0.75)";
  ctx.font = `400 ${15 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText(`${CFG.winAt} 枚金币，一颗不少`, W / 2, cy + 182 * S);

  if (winT > 1.6) {
    const p = 0.45 + 0.35 * Math.sin(winT * 2.6);
    ctx.globalAlpha = a * p;
    ctx.fillStyle = "rgba(255,240,220,0.9)";
    ctx.font = `400 ${15 * S}px "Noto Sans SC",sans-serif`;
    ctx.fillText("点一下，再跑一次", W / 2, H * 0.86);
  }
  ctx.globalAlpha = 1;
}

function drawOver() {
  const a = clamp(overT * 1.6, 0, 1);
  ctx.fillStyle = `rgba(12,6,20,${0.55 * a})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.shadowColor = "rgba(255,110,90,0.7)";
  ctx.shadowBlur = 24 * S;
  ctx.fillStyle = "#ffd7cc";
  ctx.font = `700 ${38 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("三条命都用完了", W / 2, H * 0.40);

  ctx.shadowBlur = 0;
  ctx.globalAlpha = a * 0.85;
  ctx.fillStyle = "rgba(255,228,210,0.8)";
  ctx.font = `400 ${16 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText(`这一趟收下了 ${got} / ${CFG.winAt} 枚`, W / 2, H * 0.40 + 48 * S);

  if (overT > 0.9) {
    const pu = 0.45 + 0.35 * Math.sin(overT * 2.8);
    ctx.globalAlpha = a * pu;
    ctx.fillStyle = "rgba(255,240,225,0.92)";
    ctx.font = `500 ${18 * S}px "Noto Sans SC",sans-serif`;
    ctx.fillText("点一下，重来", W / 2, H * 0.68);
  }
  ctx.globalAlpha = 1;
}

function drawShort() {
  const a = clamp(overT * 1.6, 0, 1);
  ctx.fillStyle = `rgba(12,6,20,${0.55 * a})`;
  ctx.fillRect(0, 0, W, H);

  const miss = CFG.coinTotal - got;
  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.shadowColor = "rgba(255,200,120,0.7)";
  ctx.shadowBlur = 24 * S;
  ctx.fillStyle = "#ffe9c4";
  ctx.font = `700 ${34 * S}px "Noto Serif SC","Songti SC",serif`;
  ctx.fillText("还差一点", W / 2, H * 0.38);

  ctx.shadowBlur = 0;
  ctx.globalAlpha = a * 0.9;
  ctx.fillStyle = "rgba(255,232,205,0.85)";
  ctx.font = `400 ${17 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText(`还差 ${miss} 枚才够 ${CFG.coinTotal} 枚`, W / 2, H * 0.38 + 46 * S);

  ctx.globalAlpha = a * 0.7;
  ctx.fillStyle = "rgba(255,225,195,0.7)";
  ctx.font = `400 ${14 * S}px "Noto Sans SC",sans-serif`;
  ctx.fillText("一颗都不能少", W / 2, H * 0.38 + 74 * S);

  if (overT > 0.9) {
    const pu = 0.45 + 0.35 * Math.sin(overT * 2.8);
    ctx.globalAlpha = a * pu;
    ctx.fillStyle = "rgba(255,240,225,0.92)";
    ctx.font = `500 ${18 * S}px "Noto Sans SC",sans-serif`;
    ctx.fillText("点一下，再跑一次", W / 2, H * 0.68);
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render() {
  if (!skyGrad) makeSky();
  drawSky();
  drawClouds();
  drawHills();
  drawBalloons();

  if (mode !== "intro") {
    drawPlats();
    drawGoal();
    drawCoins();
    drawMissiles();
    drawPlayer();
    drawParticles();
    drawMilestone();
    drawHUD();
  }

  if (mode === "intro") drawIntro();
  if (mode === "win") drawWin();
  if (mode === "over") drawOver();
  if (mode === "short") drawShort();
}

/* ══════════════════════════════  更新  ══════════════════════════════ */
function update(dt) {
  time += dt;
  if (milestone.t > 0) milestone.t -= dt;

  if (mode === "intro") {
    introT += dt;
    camX = lerp(camX, -40, 1 - Math.pow(0.001, dt));
    return;
  }

  if (mode === "play") {
    updatePlay(dt);
    const target = player.x - W * 0.30;
    camX = lerp(camX, target, 1 - Math.pow(0.0004, dt));
    camShake = Math.max(0, camShake - dt * 2.2);
    updateParticles(dt);
    return;
  }

  if (mode === "win") {
    winT += dt;
    updateParticles(dt);
    return;
  }

  if (mode === "over" || mode === "short") {
    overT += dt;
    updateParticles(dt);
    return;
  }
}

/* ══════════════════════════════  输入  ══════════════════════════════ */
const TRACK = document.getElementById("bgmTrack");
if (TRACK) TRACK.volume = 0.42;
let trackOn = false;
function startTrack() {
  if (!TRACK || trackOn) return;
  trackOn = true;
  const p = TRACK.play();
  if (p && p.catch) p.catch(() => { trackOn = false; });
}
function toggleTrack() {
  if (!TRACK) return;
  if (TRACK.paused) { TRACK.play().catch(() => {}); }
  else { TRACK.pause(); }
}

function press() {
  AU.init(); AU.resume(); startTrack();
  if (mode === "intro") {
    mode = "play"; introT = 0;
    player.coyoteT = 0; player.onGround = true;
    AU.jump();
    return;
  }
  if (mode === "win") {
    if (winT > 1.2) { reset(); mode = "play"; }
    return;
  }
  if (mode === "over" || mode === "short") {
    if (overT > 0.9) { reset(); mode = "play"; }
    return;
  }
  doJump();
}

cv.addEventListener("pointerdown", e => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") {
    e.preventDefault(); press();
  }
  if (e.code === "KeyM") AU.toggle();
});

/* ══════════════════════════════  启动  ══════════════════════════════ */
const _q = new URLSearchParams(location.search);
resize();
if (_q.has("dbg")) {
  document.title = `W=${W} H=${H} S=${S} DPR=${DPR} cw=${cv.clientWidth} ch=${cv.clientHeight} iw=${window.innerWidth} ih=${window.innerHeight}`;
}

if (_q.has("play")) {
  mode = "play"; introT = 0;
} else if (_q.has("win")) {
  mode = "win"; winT = parseFloat(_q.get("wt") || "2.0");
  got = CFG.winAt;
  fireworks = [0, 1, 2, 3, 4].map((i) => ({
    x: W * (0.18 + 0.16 * i), y: H * (0.16 + 0.05 * (i % 3)), t: i * 0.22,
    hue: [42, 30, 16, 350, 45][i],
  }));
} else if (_q.has("ms")) {
  mode = "play";
  got = parseInt(_q.get("ms") || "8", 10);
  milestone = { text: MILESTONES[got] || "永远不死", t: 1.2 };
} else if (_q.has("demo")) {
  mode = "play";
  player.y = 0;
  missiles = [
    { x: 250, y: -42, vx: 0, t: 0, ph: 0 },
    { x: 380, y: -130, vx: 0, t: 0, ph: 1 },
    { x: 160, y: -58, vx: 0, t: 0, ph: 2 },
  ];
  missileTimer = 9999;
} else if (_q.has("at")) {
  mode = "play";
  player.x = parseFloat(_q.get("at") || "600");
  extendWorld();
  camX = player.x - W * 0.30;
  const g = groundAt(player.x, -9999);
  player.y = g === null ? 0 : g;
}

let lastT = 0;
if (_q.has("bench")) {
  const secs = parseFloat(_q.get("bench") || "5");
  for (let i = 0; i < secs * 60; i++) update(1 / 60);
}
let _cw = 0, _ch = 0;
function loop(t) {
  if (cv.clientWidth !== _cw || cv.clientHeight !== _ch) {
    _cw = cv.clientWidth; _ch = cv.clientHeight;
    resize();
  }
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  dt = Math.min(dt, 0.05);
  update(dt);
  AU.bgmTick();
  render();
  requestAnimationFrame(loop);
}
makeSky();
requestAnimationFrame(loop);
</script>
</body>
